name: Deploy with cache busting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add build timestamp to HTML
        run: |
          BUILD_TIME=$(date +%s)
          sed -i "s|</head>|<meta name=\"build\" content=\"${BUILD_TIME}\"></head>|" index.html
          echo "Build timestamp: ${BUILD_TIME}"

      - name: Commit and push updated file
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Cache bust: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
